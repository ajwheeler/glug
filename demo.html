<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>glug 🍼 - DEMO</title>
    <style>
        :root {
            --bg-dark-1: #18151d;
            --bg-dark-2: #0c021b;
            --card-bg: #2a132f;
            --text-primary: #e9ede8;
            --text-secondary: #d4c4d2;
            --accent: #cfa8dd;
            --accent-soft: #af7fb2;
            --error: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rounded Mplus 1c', ui-rounded, 'Hiragino Maru Gothic ProN', Quicksand, Comfortaa, Manjari, 'Arial Rounded MT Bold', Calibri, source-sans-pro, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark-1) 0%, var(--bg-dark-2) 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: var(--text-primary);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            height: -webkit-fill-available;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-shrink: 0;
        }

        .add-button,
        .add-button-half {
            font-weight: 400;
            background: var(--card-bg);
            border: 2px solid var(--accent-soft);
            border-radius: 30px;
            color: var(--accent);
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-button {
            flex: 2;
            padding: 30px;
            font-size: 2em;
        }

        .add-button-half {
            flex: 1;
            padding: 20px;
            font-size: 1.3em;
        }

        .add-button:active,
        .add-button-half:active {
            transform: scale(0.95);
        }

        .add-button.pending {
            border-color: var(--accent);
            background: rgba(207, 168, 221, 0.1);
        }

        .feed-history {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 25px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        #feedList {
            overflow-y: auto;
            flex: 1;
        }

        .feed-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .feed-history h2 {
            font-size: 1.2em;
            color: var(--accent);
            margin: 0;
            font-weight: 400;
        }

        .time-since-last {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .total-24h-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 20px;
        }

        .total-24h-bar h1 {
            font-size: 3em;
            color: var(--text-primary);
            margin: 0;
            font-weight: 300;
        }

        .total-24h-amount {
            text-align: right;
        }

        .total-24h {
            font-size: 2em;
            font-weight: 400;
            color: var(--accent);
            line-height: 1;
        }

        .total-24h-label {
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .feed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.95em;
        }

        .feed-item:last-child {
            border-bottom: none;
        }

        .feed-info {
            display: flex;
            justify-content: space-between;
            flex: 1;
        }

        .feed-time {
            color: var(--text-secondary);
        }

        .feed-amount {
            font-weight: 400;
            color: var(--accent);
        }

        .delete-btn {
            background: rgba(255, 107, 107, 0.326);
            border: 2px solid transparent;
            border-radius: 12px;
            color: #dfd2d2;
            font-size: 1.4em;
            cursor: pointer;
            padding: 3px 16px;
            margin: 0px 12px;
            opacity: 0.7;
            min-width: 50px;
            min-height: 44px;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .delete-btn:hover {
            opacity: 1;
            background: rgba(255, 107, 107, 0.25);
        }

        .delete-btn:active {
            transform: scale(0.95);
        }

        .delete-btn.pending {
            border-color: var(--error);
            background: rgba(255, 107, 107, 0.4);
            opacity: 1;
        }

        .feed-item.deleting {
            opacity: 0.5;
            pointer-events: none;
        }

        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            width: 90%;
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: var(--accent);
            text-align: center;
            font-weight: 400;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: var(--bg-dark-1);
            color: var(--text-primary);
            border: 2px solid var(--accent-soft);
            border-radius: 15px;
            font-size: 1em;
        }

        .login-box button {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: var(--bg-dark-1);
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 400;
            cursor: pointer;
        }

        .error {
            color: var(--error);
            text-align: center;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="container">
            <div class="total-24h-bar">
                <h1>glug 🍼</h1>
                <div class="total-24h-amount">
                    <div class="total-24h" id="last24Hours">0 oz</div>
                    <div class="total-24h-label">last 24 hours</div>
                </div>
            </div>

            <div class="feed-history">
                <div class="feed-history-header">
                    <h2>Recent Feeds</h2>
                    <span class="time-since-last" id="timeSinceLast">—</span>
                </div>
                <div id="feedList"></div>
            </div>

            <div class="button-group">
                <button class="add-button" onclick="addFeed()" data-original-label="+ 1 oz">
                    <span class="button-label">+ 1 oz</span>
                </button>
                <button class="add-button-half" onclick="addHalfOz()" data-original-label="+ ½ oz">
                    <span class="button-label">+ ½ oz</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // DEMO VERSION - Mock data for preview only
        // Buttons are non-functional in this demo

        function addFeed() {
            alert('This is a demo version. Buttons are non-functional.');
        }

        function addHalfOz() {
            alert('This is a demo version. Buttons are non-functional.');
        }

        function decrementChunk() {
            // Non-functional in demo
        }

        function loadMockData() {
            // Set 24-hour total
            document.getElementById('last24Hours').textContent = '18.5 oz';

            // Set time since last feed
            document.getElementById('timeSinceLast').textContent = '45m ago';

            // Create mock feed history
            const mockFeeds = [
                { time: '2:30 PM', amount: 3 },
                { time: '12:45 PM', amount: 2.5 },
                { time: '11:00 AM', amount: 2 },
                { time: '9:15 AM', amount: 3 },
                { time: '7:30 AM', amount: 2.5 },
                { time: '5:45 AM', amount: 2 },
                { time: '3:15 AM', amount: 2.5 },
                { time: '1:00 AM', amount: 3 }
            ];

            const feedList = document.getElementById('feedList');
            feedList.innerHTML = mockFeeds.map((feed, index) => `
                <div class="feed-item">
                    <div class="feed-info">
                        <span class="feed-time">${feed.time}</span>
                        <span class="feed-amount">${feed.amount} oz</span>
                    </div>
                    <button class="delete-btn" onclick="decrementChunk()" title="Remove 0.5 oz" data-original-label="⁻¹⁄₂">
                        <span class="button-label">⁻¹⁄₂</span>
                    </button>
                </div>
            `).join('');
        }

        // Initialize demo on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadMockData();
        });
    </script>
</body>

</html>
